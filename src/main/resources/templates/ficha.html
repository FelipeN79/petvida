<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ficha do Animal</title>
</head>
<body>
    <h1>Ficha do Animal</h1>
    <p>Nome: <span th:text="${nomeAnimal}">nome</span></p>
    <p>Espécie: <span th:text="${especieAnimal}">especie</span></p>
    <p>Idade: <span th:text="${idadeAnimal}">idade</span></p>
    <p>Tutor: <span th:text="${nomeTutor}">tutor</span></p>
    <p>Telefone do tutor: <span th:text="${telefoneTutor}">telefone</span></p>
</body>
</html>
